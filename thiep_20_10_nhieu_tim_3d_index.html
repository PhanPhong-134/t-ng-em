<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Happy 20/10 - Đến Khi Nào ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: 'Quicksand', sans-serif;
      background: radial-gradient(circle at top, #2d0b24 0%, #150519 50%, #08010d 100%);
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    #fx-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    #start-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 5, 20, 0.95);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      transition: opacity 0.8s ease, visibility 0.8s ease;
      padding: 24px;
      text-align: center;
    }
    #start-overlay.hidden {
      opacity: 0;
      visibility: hidden;
    }
    .gift-box {
      font-size: 80px;
      animation: bounce 1.4s infinite alternate ease-in-out;
      cursor: pointer;
      margin-bottom: 20px;
      filter: drop-shadow(0 0 25px rgba(255, 105, 180, 0.8));
    }
    @keyframes bounce {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-20px) scale(1.08); }
    }
    .open-btn {
      background: linear-gradient(135deg, #ff4e88, #ff85a2);
      border: none;
      color: white;
      padding: 14px 36px;
      font-size: 18px;
      font-weight: 700;
      font-family: 'Quicksand', sans-serif;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(255, 78, 136, 0.5);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 15px rgba(255, 78, 136, 0.4); }
      50% { box-shadow: 0 0 35px rgba(255, 78, 136, 0.9); }
    }

    .container {
      position: relative;
      z-index: 2;
      max-width: 520px;
      margin: 0 auto;
      padding: 30px 20px 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .badge-date {
      display: inline-block;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 182, 193, 0.35);
      padding: 6px 18px;
      border-radius: 30px;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #ffb7c5;
      margin-bottom: 16px;
      backdrop-filter: blur(5px);
    }

    h1.title {
      font-family: 'Dancing Script', cursive;
      font-size: 42px;
      font-weight: 700;
      color: #ffd6e0;
      text-shadow: 0 0 20px rgba(255, 105, 180, 0.8), 0 0 40px rgba(255, 78, 136, 0.4);
      line-height: 1.25;
      margin-bottom: 24px;
    }

    .slider-card {
      width: 100%;
      background: #ffffff;
      padding: 14px 14px 28px;
      border-radius: 14px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.6), 0 0 30px rgba(255, 105, 180, 0.3);
      transform: rotate(-1.5deg);
      transition: transform 0.4s ease;
      margin-bottom: 28px;
      position: relative;
    }
    .slider-card:hover {
      transform: rotate(0deg) scale(1.02);
    }
    .photo-frame {
      width: 100%;
      height: 380px;
      overflow: hidden;
      border-radius: 8px;
      position: relative;
      background: #111;
    }
    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
      opacity: 0;
      transition: opacity 0.8s ease-in-out, transform 0.8s ease;
      transform: scale(1.04);
    }
    .photo-frame img.active {
      opacity: 1;
      transform: scale(1);
    }
    .polaroid-caption {
      color: #4a4a4a;
      font-family: 'Dancing Script', cursive;
      font-size: 24px;
      margin-top: 14px;
      font-weight: 700;
    }
    .slider-dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ddd;
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .dot.active {
      background: #ff4e88;
      width: 24px;
      border-radius: 10px;
    }

    .letter-box {
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      text-align: left;
      line-height: 1.8;
      font-size: 15.5px;
      color: #ffeef2;
      position: relative;
    }
    .letter-box::before {
      content: '💌';
      position: absolute;
      top: -16px;
      left: 24px;
      font-size: 26px;
      background: #250920;
      padding: 0 6px;
      border-radius: 50%;
    }
    #typewriter {
      white-space: pre-line;
      min-height: 160px;
    }
    .cursor {
      display: inline-block;
      width: 2px;
      background-color: #ff69b4;
      animation: blink 0.8s infinite;
      margin-left: 2px;
    }
    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    .music-btn {
      position: fixed;
      bottom: 22px;
      right: 22px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(255, 78, 136, 0.85);
      border: 2px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      cursor: pointer;
      z-index: 100;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      animation: spin 6s linear infinite;
    }
    .music-btn.paused {
      animation-play-state: paused;
      opacity: 0.6;
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .signature {
      margin-top: 25px;
      font-family: 'Dancing Script', cursive;
      font-size: 26px;
      color: #ff9ebb;
      text-align: right;
    }
  </style>
</head>
<body>

  <canvas id="fx-canvas"></canvas>

  <div id="start-overlay">
    <div class="gift-box" id="gift-icon">🎁</div>
    <h2 style="font-family: 'Dancing Script', cursive; font-size: 34px; color: #ffd6e0; margin-bottom: 10px;">Có một món quà đặc biệt dành cho bạn!</h2>
    <p style="color: #ffb7c5; margin-bottom: 28px; font-size: 15px;">Chạm vào hộp quà để mở điều bất ngờ nhé ❤️</p>
    <button class="open-btn" id="open-btn">Mở Quà Ngay ✨</button>
  </div>

  <div class="container">
    <div class="badge-date">✨ 20.10.2024 - NGÀY PHỤ NỮ VIỆT NAM ✨</div>

  <div class="music-btn" id="music-btn" title="Bật/Tắt nhạc">🎵</div>
  <audio id="bg-audio" loop preload="auto">
    <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf756.mp3?filename=romantic-guitars-112133.mp3" type="audio/mpeg">
    <source src="https://archive.org/download/FamousEnglishSongs/A%20Thousand%20Years.mp3" type="audio/mpeg">
  </audio>


  <script>
    let audioCtx = null;
    let isPlaying = false;
    let noteTimer = null;

    const melody = [
      261.63, 329.63, 392.00, 523.25, 440.00, 392.00, 329.63, 349.23,
      392.00, 440.00, 523.25, 587.33, 523.25, 392.00, 329.63, 293.66,
      261.63, 329.63, 392.00, 440.00, 392.00, 349.23, 329.63, 261.63
    ];
    let noteIdx = 0;

    function playNote(freq, duration) {
      if (!audioCtx || audioCtx.state !== 'running') return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        
        gain.gain.setValueAtTime(0, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.08, audioCtx.currentTime + 0.08);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    const bgAudio = document.getElementById('bg-audio');

    function startMusic() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      isPlaying = true;
      document.getElementById('music-btn').classList.remove('paused');
      
      if (bgAudio) {
        bgAudio.play().catch(e => console.log("Audio play error", e));
      }

      clearInterval(noteTimer);
      noteTimer = setInterval(() => {
        playNote(melody[noteIdx % melody.length], 0.9);
        noteIdx++;
      }, 550);
    }

    function toggleMusic() {
      const btn = document.getElementById('music-btn');
      if (isPlaying) {
        if (bgAudio) bgAudio.pause();
        clearInterval(noteTimer);
        isPlaying = false;
        btn.classList.add('paused');
      } else {
        startMusic();
      }
    }
    document.getElementById('music-btn').addEventListener('click', toggleMusic);

    const canvas = document.getElementById('fx-canvas');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    
    const particles = [];
    for (let i = 0; i < 50; i++) {
      particles.push({
        x: Math.random() * width,
        y: Math.random() * height + height,
        size: Math.random() * 22 + 12,
        speedY: Math.random() * 1.8 + 0.8,
        speedX: (Math.random() - 0.5) * 1.5,
        rotation: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.05,
        scale: Math.random() * 0.6 + 0.7,
        scaleSpeed: (Math.random() - 0.5) * 0.01,
        opacity: Math.random() * 0.8 + 0.2,
        color: ['#ff4e88', '#ff758c', '#ff7eb3', '#fda7df', '#ff3366', '#ff6584'][Math.floor(Math.random() * 6)],
        type: Math.random() > 0.3 ? 'heart' : 'sparkle'
      });
    }

    function drawHeart(ctx, x, y, size, color, alpha, rotation, scale) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rotation);
      ctx.scale(scale, scale);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = 15;
      
      ctx.beginPath();
      let d = size;
      ctx.moveTo(0, d / 4);
      ctx.bezierCurveTo(-d / 2, -d / 2, -d, d / 3, 0, d);
      ctx.bezierCurveTo(d, d / 3, d / 2, -d / 2, 0, d / 4);
      ctx.fill();
      ctx.restore();
    }

    function renderParticles() {
      ctx.clearRect(0, 0, width, height);
      particles.forEach(p => {
        p.rotation += p.rotSpeed;
        p.scale += p.scaleSpeed;
        if (p.scale > 1.4 || p.scale < 0.6) p.scaleSpeed *= -1;

        if (p.type === 'heart') {
          drawHeart(ctx, p.x, p.y, p.size, p.color, p.opacity, p.rotation, p.scale);
        } else {
          ctx.save();
          ctx.globalAlpha = p.opacity;
          ctx.font = `${p.size}px serif`;
          ctx.fillText('✨', p.x, p.y);
          ctx.restore();
        }

        p.y -= p.speedY;
        p.x += p.speedX + Math.sin(p.y * 0.02) * 0.6;

        if (p.y < -50) {
          p.y = height + 50;
          p.x = Math.random() * width;
        }
      });
      requestAnimationFrame(renderParticles);
    }
    renderParticles();


    const images = document.querySelectorAll('.photo-frame img');
    const dots = document.querySelectorAll('.dot');
    const captions = [
      "Mãi xinh đẹp và rạng rỡ như thế này nhé! 💕",
      "Nụ cười đẹp và ngọt ngào nhất ✨",
      "Chúc em luôn luôn vui vẻ và bình yên 🌸",
      "Chúc người phụ nữ tuyệt vời nhất 20/10 thật hạnh phúc ❤️"
    ];
    let currentIdx = 0;

    function showSlide(index) {
      images[currentIdx].classList.remove('active');
      dots[currentIdx].classList.remove('active');
      currentIdx = (index + images.length) % images.length;
      images[currentIdx].classList.add('active');
      dots[currentIdx].classList.add('active');
      document.getElementById('caption-text').innerText = captions[currentIdx];
    }

    function jumpTo(idx) {
      showSlide(idx);
    }

    setInterval(() => {
      showSlide(currentIdx + 1);
    }, 3500);

    const fullText = `Nhân ngày Phụ nữ Việt Nam 20/10... 🌹

"Đến khi nào mặt trời ngừng chiếu...
Thì anh mới thôi yêu em!"

Chúc cô gái đặc biệt nhất của anh luôn luôn xinh đẹp, ngập tràn nụ cười và hạnh phúc. 

Cảm ơn em vì đã xuất hiện, mang đến cho anh những khoảnh khắc dịu dàng, bình yên và ấm áp nhất. Dù mai này ra sao, anh vẫn luôn ở đây đồng hành và chở che cho em.

Chúc em ngày 20/10 thật rực rỡ và trọn vẹn nhé! ✨❤️`;

    let charIdx = 0;
    function typeEffect() {
      if (charIdx < fullText.length) {
        document.getElementById('typewriter').textContent += fullText.charAt(charIdx);
        charIdx++;
        setTimeout(typeEffect, fullText.charAt(charIdx - 1) === '\n' ? 220 : 45);
      }
    }

    function openGift() {
      document.getElementById('start-overlay').classList.add('hidden');
      startMusic();
      setTimeout(typeEffect, 600);
    }

    document.getElementById('open-btn').addEventListener('click', openGift);
    document.getElementById('gift-icon').addEventListener('click', openGift);

  </script>
</body>
</html>
